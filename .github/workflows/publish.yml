name: Publish GHCR

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libnss3-tools openssl
      - run: npx playwright install --with-deps chromium
      - run: node --test test-ca/unit.test.cjs test-ca/browser.test.cjs
      - run: npx playwright test tests/cli.spec.ts
      - run: npm run lint && git diff --exit-code

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare image tags
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must look like v0.1.0 or v0.1.0-rc.1' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$image"
            echo 'tags<<TAGS'
            echo "$image:$RELEASE_TAG"
            echo "$image:${RELEASE_TAG#v}"
            if [[ "$PRERELEASE" == false && "$RELEASE_TAG" != *-* ]]; then
              echo "$image:latest"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=Playwright MCP with Linux CA bundle support
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,mode=max,scope=ghcr
